{% extends 'base.html' %}

{% block title %}
Update Post
{% endblock %}

{% block content %}
<h2>Update Post</h2>
<div class="card">
    <div class="card-body">
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit"
                    class="btn btn-warning">
                Update Post
            </button>
            <a href="{% url 'post_detail' post.id %}"
               class="btn btn-secondary">
                Cancel
            </a>
       </form>
    </div>
</div>
{% endblock %}
