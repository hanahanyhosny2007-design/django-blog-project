{% extends 'base.html' %}

{% block title %}
Add New Post
{% endblock %}

{% block content %}
<h2>Add New Post</h2>
<div class="card">
    <div class="card-body">
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit"
                    class="btn btn-success">
                Publish Post
            </button>
            <a href="{% url 'posts' %}"
               class="btn btn-secondary">
                Cancel
            </a>
        </form>
    </div>
</div>
{% endblock %}
