{% extends 'base.html' %}

{% block title %}
Delete Post
{% endblock %}

{% block content %}
<div class="card">
    <div class="card-body">
        <h2>Delete Post</h2>
        <p>
            Are you sure you want to delete
            <strong>{{ post.title }}</strong>?
        </p>
        <form method="POST">
            {% csrf_token %}
            <button type="submit"
                    class="btn btn-danger">
                Yes, Delete
            </button>
            <a href="{% url 'post_detail' post.id %}"
               class="btn btn-secondary">
                Cancel
            </a>
        </form>
    </div>
</div>
{% endblock %}
