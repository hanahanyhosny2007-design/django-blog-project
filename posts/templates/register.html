{% extends 'base.html' %}

{% block title %}
Register
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <h2 class="mb-4">
                    Create Account
                </h2>
                <form method="POST">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit"
                            class="btn btn-primary">
                        Register
                    </button>
                </form>
                <p class="mt-3">
                    Already have an account?
                    <a href="{% url 'login' %}">
                        Login
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
